<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montevideo 3660</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#loading{
  position:fixed;inset:0;z-index:4000;background:#1e1e2e;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  color:#cba6f7;font-size:14px
}
.spinner{
  width:38px;height:38px;border:3px solid #313244;
  border-top-color:#cba6f7;border-radius:50%;
  animation:spin .8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
#map{position:fixed;top:86px;left:0;right:0;bottom:0}
#statusbar{
  position:fixed;top:50px;left:0;right:0;height:36px;z-index:999;
  background:rgba(20,20,30,0.92);backdrop-filter:blur(6px);
  display:flex;align-items:center;padding:0 10px;gap:6px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  border-bottom:1px solid #2a2a3e;scrollbar-width:none
}
#statusbar::-webkit-scrollbar{display:none}
.sb-chip{
  flex-shrink:0;padding:4px 11px;border-radius:20px;
  border:1px solid #444;background:#2a2a3e;color:#9ca3af;
  font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap
}
.sb-chip.active{background:#cba6f7;color:#1e1e2e;border-color:#cba6f7}
#topbar{
  position:fixed;top:0;left:0;right:0;height:50px;z-index:1000;
  background:rgba(20,20,30,0.95);backdrop-filter:blur(8px);
  display:flex;align-items:center;padding:0 12px;gap:10px;
  border-bottom:1px solid #333
}
#topbar-title{font-size:14px;font-weight:700;color:#cba6f7;white-space:nowrap}
#counter{font-size:12px;color:#888;flex:1}
#filter-btn{
  background:#2a2a3e;border:1px solid #555;color:#cdd6f4;
  border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;
  white-space:nowrap;flex-shrink:0
}
#filter-btn.active{background:#cba6f7;color:#1e1e2e;border-color:#cba6f7}
#overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1999;
  display:none;backdrop-filter:blur(1px)
}
#overlay.open{display:block}
#fp{
  position:fixed;top:0;right:-300px;bottom:0;width:280px;z-index:2000;
  background:#1e1e2e;border-left:1px solid #333;
  display:flex;flex-direction:column;transition:right .25s ease
}
#fp.open{right:0}
#fp-head{
  display:flex;align-items:center;padding:14px 16px;
  background:#313244;flex-shrink:0;gap:10px
}
#fp-head span{font-size:14px;font-weight:700;color:#cba6f7;flex:1}
#fp-close{
  background:none;border:none;color:#888;font-size:18px;cursor:pointer;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center
}
#fp-btns{display:flex;gap:8px;padding:10px 14px;flex-shrink:0}
.fp-btn{
  flex:1;padding:7px;border-radius:8px;border:none;cursor:pointer;
  font-size:12px;font-weight:600
}
.fp-all{background:#45475a;color:#cdd6f4}
.fp-none{background:#313244;color:#888}
#fp-list{overflow-y:auto;flex:1;padding-bottom:8px}
#fp-quality{padding:10px 14px 4px;flex-shrink:0;border-bottom:1px solid #313244}
.fq-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6c7086;margin-bottom:8px}
.fq-row{margin-bottom:10px}
.fq-label{display:block;font-size:11px;color:#a6adc8;margin-bottom:3px}
.fq-val{color:#cba6f7;font-weight:700}
.fq-slider{width:100%;accent-color:#cba6f7;cursor:pointer;margin-top:2px}
.fq-checks{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.fq-check{display:flex;align-items:center;gap:5px;font-size:12px;color:#cdd6f4;cursor:pointer}
#fp-export{padding:12px 14px;flex-shrink:0;border-top:1px solid #313244}
#btn-export{
  width:100%;padding:10px;background:#22C55E;color:white;
  border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer
}
#btn-export:active{background:#16a34a}
.fp-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;cursor:pointer;color:#cdd6f4
}
.fp-row:active{background:#313244}
.fp-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.fp-label{flex:1;font-size:13px}
.fp-cnt{font-size:11px;color:#6c7086}
input[type=checkbox]{
  accent-color:#cba6f7;width:17px;height:17px;flex-shrink:0;cursor:pointer
}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.18)}
.leaflet-popup-content{margin:14px 16px;min-width:230px}
.pop-name{font-size:16px;font-weight:700;margin-bottom:4px;line-height:1.2}
.pop-badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;color:white;margin-bottom:8px}
.pop-addr{font-size:12px;color:#666;margin-bottom:6px;line-height:1.4}
.pop-phone{font-size:15px;font-weight:600;color:#16a34a;text-decoration:none;display:block;margin-bottom:5px}
.pop-rating{font-size:12px;color:#555;margin-bottom:8px}
.pop-status{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.pop-sb{
  padding:5px 9px;border-radius:7px;border:1.5px solid;cursor:pointer;
  font-size:11px;font-weight:600;background:white;opacity:0.45;transition:opacity .15s
}
.pop-sb.active{opacity:1;background:#f8f8f8}
.pop-note{
  width:100%;border:1px solid #ddd;border-radius:7px;padding:7px 8px;
  font-size:13px;resize:none;min-height:52px;font-family:inherit;
  background:#fafafa;margin-bottom:8px;display:block
}
.pop-save{
  width:100%;background:#cba6f7;color:#1e1e2e;border:none;border-radius:8px;
  padding:9px;font-size:13px;font-weight:700;cursor:pointer;display:block
}
.loc-dot{
  width:16px;height:16px;border-radius:50%;
  background:#3B82F6;border:2.5px solid white;
  box-shadow:0 0 0 0 rgba(59,130,246,0.5);
  animation:pulse-loc 2s infinite
}
@keyframes pulse-loc{
  0%{box-shadow:0 0 0 0 rgba(59,130,246,0.5)}
  70%{box-shadow:0 0 0 10px rgba(59,130,246,0)}
  100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}
}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><div>Kaart laden...</div></div>

<div id="topbar">
  <span id="topbar-title">Montevideo</span>
  <span id="counter">Laden...</span>
  <button id="filter-btn">☰ Categorieën</button>
</div>

<div id="statusbar">
  <button class="sb-chip active" data-st="">Alles</button>
  <button class="sb-chip" data-st="onbezocht">Onbezocht</button>
  <button class="sb-chip" data-st="bezocht">Bezocht</button>
  <button class="sb-chip" data-st="verkocht">✅ Verkocht</button>
  <button class="sb-chip" data-st="interesse">📞 Follow-up</button>
  <button class="sb-chip" data-st="later">🔄 Later</button>
  <button class="sb-chip" data-st="nee">🚫 Nee</button>
  <button class="sb-chip" data-st="dicht">🔒 Dicht</button>
</div>

<div id="overlay"></div>

<div id="fp">
  <div id="fp-head">
    <span>Categorieën</span>
    <button id="fp-close">✕</button>
  </div>
  <div id="fp-btns">
    <button class="fp-btn fp-all" id="btn-all">Alles aan</button>
    <button class="fp-btn fp-none" id="btn-none">Alles uit</button>
  </div>
  <div id="fp-quality">
    <div class="fq-title">Gevestigdheid</div>
    <div class="fq-row">
      <label class="fq-label">Min. reviews: <span class="fq-val" id="lbl-reviews">0</span></label>
      <input type="range" id="sl-reviews" min="0" max="300" step="10" value="0" class="fq-slider">
    </div>
    <div class="fq-row">
      <label class="fq-label">Min. beoordeling: <span class="fq-val" id="lbl-rating">0.0</span> ★</label>
      <input type="range" id="sl-rating" min="0" max="5" step="0.5" value="0" class="fq-slider">
    </div>
    <div class="fq-checks">
      <label class="fq-check"><input type="checkbox" id="cb-instagram" style="accent-color:#cba6f7"> Instagram</label>
      <label class="fq-check"><input type="checkbox" id="cb-social" style="accent-color:#cba6f7"> Social media</label>
    </div>
  </div>
  <div id="fp-list"></div>
  <div id="fp-export">
    <button id="btn-export">📥 Exporteer naar Excel</button>
  </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
var CATS        = {"Kapper": "#F472B6", "Nagelstudio": "#EC4899", "Schoonheidssalon": "#DB2777", "Spa & Massage": "#A855F7", "Restaurant": "#F97316", "Café & Bar": "#FB923C", "Bakkerij": "#FBBF24", "Sportschool": "#22C55E", "Supermarkt": "#16A34A", "Kledingwinkel": "#3B82F6", "Elektronicawinkel": "#1D4ED8", "Bloemenwinkel": "#10B981", "Dierenwinkel": "#059669", "Winkel (overig)": "#60A5FA", "Tandarts": "#EF4444", "Apotheek": "#DC2626", "Dokter / Kliniek": "#B91C1C", "Dierenarts": "#991B1B", "Autogarage": "#6B7280", "Wasserette": "#9CA3AF", "Makelaar": "#64748B", "Diensten (overig)": "#94A3B8", "Hotel / Verblijf": "#EAB308", "Overig": "#CBD5E1"};
var STATUS_KLEUR= {verkocht:'#22C55E',interesse:'#3B82F6',later:'#F97316',nee:'#6B7280',dicht:'#EAB308'};
var DATA=[]; var leafletMarkers=[]; var pidToIdx={};
var voortgang={}; var pending={}; var activePopup={pid:'',naam:''};
var selectedCats=new Set(Object.keys(CATS));
var selectedStatus=null;
var minReviews=0,minRating=0,onlyInstagram=false,onlySocial=false;
var CHIP_KLEUR={'':'#cba6f7','onbezocht':'#94A3B8','bezocht':'#a78bfa','verkocht':'#22C55E','interesse':'#3B82F6','later':'#F97316','nee':'#6B7280','dicht':'#EAB308'};

// ── Kaart direct initialiseren (tiles laden terwijl data nog fetcht) ───────
var map=L.map('map',{zoomControl:false}).setView([-34.906,-56.160],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'© OSM',maxZoom:19}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);
var cluster=L.markerClusterGroup({
  maxClusterRadius:55,disableClusteringAtZoom:17,chunkedLoading:true,
  iconCreateFunction:function(c){
    var n=c.getChildCount(),sz=n>100?44:n>30?38:32;
    return L.divIcon({html:'<div style="background:#cba6f7;color:#1e1e2e;border-radius:50%;width:'+sz+'px;height:'+sz+'px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.4)">'+n+'</div>',className:'',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});
  }
});
map.addLayer(cluster);
// ── Marker icon helper ─────────────────────────────────────────────────────
function maakMarkerIcon(kleur, heeftStatus){
  var inner=heeftStatus?'<span style="color:white;font-size:9px;font-weight:900;line-height:14px">✓</span>':'';
  return L.divIcon({
    html:'<div style="background:'+kleur+';width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,0.3)">'+inner+'</div>',
    className:'',iconSize:[14,14],iconAnchor:[7,7],popupAnchor:[0,-8]
  });
}

// ── Popup ──────────────────────────────────────────────────────────────────
function catKleur(p){return CATS[p.c]||'#CBD5E1';}
function markerKleur(p){var vg=voortgang[p.id],st=vg?vg.status:'';return STATUS_KLEUR[st]||catKleur(p);}
function mapsUrl(p){return 'https://www.google.com/maps/place/?q=place_id:'+p.id;}

function popupHtml(p){
  activePopup={pid:p.id,naam:p.n};
  var vg=voortgang[p.id]||{},pend=pending[p.id];
  var st=pend!==undefined?pend:(vg.status||'');
  var STAT=[{s:'verkocht',l:'✅ Verkocht',c:'#22C55E'},{s:'interesse',l:'📞 Follow-up',c:'#3B82F6'},
            {s:'later',l:'🔄 Later',c:'#F97316'},{s:'nee',l:'🚫 Nee',c:'#6B7280'},{s:'dicht',l:'🔒 Dicht',c:'#EAB308'}];
  var sb='<div class="pop-status">';
  STAT.forEach(function(sv){var a=st===sv.s?' active':'';sb+='<button class="pop-sb'+a+'" data-s="'+sv.s+'" style="color:'+sv.c+';border-color:'+sv.c+'">'+sv.l+'</button>';});
  sb+='</div>';
  var kl=catKleur(p);
  return '<div class="pop-name">'+p.n+'</div>'+
    '<div><span class="pop-badge" style="background:'+kl+'">'+p.c+'</span></div>'+
    '<div class="pop-addr">'+p.a+'</div>'+
    (p.p?'<a class="pop-phone" href="tel:'+p.p+'">📞 '+p.p+'</a>':'')+
    (p.r?'<div class="pop-rating">⭐ '+p.r+' <span style="color:#aaa">('+p.rv+' reviews)</span></div>':'')+
    '<a href="'+mapsUrl(p)+'" target="_blank" style="font-size:12px;color:#4285F4;display:block;margin-bottom:10px">🗺 Maps (openingstijden →)</a>'+
    sb+'<textarea class="pop-note" id="nt_'+p.id+'" placeholder="Notitie...">'+(vg.notitie||'')+'</textarea>'+
    '<button class="pop-save">Opslaan</button>';
}

function selStatus(s){
  var pid=activePopup.pid; pending[pid]=s;
  document.querySelectorAll('.pop-sb').forEach(function(b){b.classList.toggle('active',b.dataset.s===s);});
}
function slaOp(){
  var pid=activePopup.pid,naam=activePopup.naam;
  var st=pending[pid]!==undefined?pending[pid]:(voortgang[pid]?voortgang[pid].status:'');
  var ntEl=document.getElementById('nt_'+pid), notitie=ntEl?ntEl.value:'';
  voortgang[pid]={status:st,notitie:notitie};
  delete pending[pid];
  var idx=pidToIdx[pid];
  if(idx!==undefined){
    var kl=markerKleur(DATA[idx]);
    leafletMarkers[idx].setIcon(maakMarkerIcon(kl,!!st));
  }
  fetch('/api/voortgang',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({place_id:pid,naam:naam,status:st,notitie:notitie})}).catch(function(){});
  map.closePopup();
}

// ── Render ─────────────────────────────────────────────────────────────────
function render(){
  var toShow=[];
  DATA.forEach(function(p,i){
    if(!selectedCats.has(p.c)) return;
    var rv=parseInt(p.rv)||0, rt=parseFloat(p.r)||0;
    if(rv<minReviews||rt<minRating) return;
    if(onlyInstagram&&p.wt!=='instagram') return;
    if(onlySocial&&p.wt!=='instagram'&&p.wt!=='facebook') return;
    var st=(voortgang[p.id]&&voortgang[p.id].status)||'';
    if(selectedStatus===null){
      toShow.push(leafletMarkers[i]);
    } else if(selectedStatus==='onbezocht'){
      if(!st) toShow.push(leafletMarkers[i]);
    } else if(selectedStatus==='bezocht'){
      if(st) toShow.push(leafletMarkers[i]);
    } else {
      if(st===selectedStatus) toShow.push(leafletMarkers[i]);
    }
  });
  cluster.clearLayers();cluster.addLayers(toShow);
  document.getElementById('counter').textContent=toShow.length+' prospects';
}

// ── Filter panel ───────────────────────────────────────────────────────────
function openFilter(){document.getElementById('fp').classList.add('open');document.getElementById('overlay').classList.add('open');document.getElementById('filter-btn').classList.add('active');}
function closeFilter(){document.getElementById('fp').classList.remove('open');document.getElementById('overlay').classList.remove('open');document.getElementById('filter-btn').classList.remove('active');}

function buildCatList(counts){
  var fpList=document.getElementById('fp-list'); fpList.innerHTML='';
  var sorted=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];});
  sorted.forEach(function(cat){
    var cnt=counts[cat],kleur=CATS[cat]||'#CBD5E1';
    var row=document.createElement('label'); row.className='fp-row';
    row.innerHTML='<input type="checkbox" checked data-cat="'+cat+'"><span class="fp-dot" style="background:'+kleur+'"></span><span class="fp-label">'+cat+'</span><span class="fp-cnt">'+cnt+'</span>';
    row.querySelector('input').addEventListener('change',function(){if(this.checked)selectedCats.add(cat);else selectedCats.delete(cat);render();});
    fpList.appendChild(row);
  });
}

// ── Event delegation ───────────────────────────────────────────────────────
document.addEventListener('click',function(e){
  var sb=e.target.closest&&e.target.closest('.pop-sb'); if(sb){selStatus(sb.dataset.s);return;}
  var sv=e.target.closest&&e.target.closest('.pop-save'); if(sv){slaOp();return;}
  var chip=e.target.closest&&e.target.closest('.sb-chip');
  if(chip){
    document.querySelectorAll('.sb-chip').forEach(function(c){
      c.classList.remove('active');c.style.background='';c.style.color='';c.style.borderColor='';
    });
    var st=chip.dataset.st;
    selectedStatus=st===''?null:st;
    var kl=CHIP_KLEUR[st]||'#cba6f7';
    chip.classList.add('active');chip.style.background=kl;chip.style.color='#1e1e2e';chip.style.borderColor=kl;
    render();return;
  }
});
document.getElementById('filter-btn').addEventListener('click',openFilter);
document.getElementById('fp-close').addEventListener('click',closeFilter);
document.getElementById('overlay').addEventListener('click',closeFilter);
document.getElementById('btn-all').addEventListener('click',function(){document.querySelectorAll('[data-cat]').forEach(function(cb){cb.checked=true;selectedCats.add(cb.dataset.cat);});render();});
document.getElementById('btn-none').addEventListener('click',function(){document.querySelectorAll('[data-cat]').forEach(function(cb){cb.checked=false;selectedCats.delete(cb.dataset.cat);});render();});
document.getElementById('sl-reviews').addEventListener('input',function(){minReviews=parseInt(this.value);document.getElementById('lbl-reviews').textContent=minReviews+(this.value==='300'?'+':'');render();});
document.getElementById('sl-rating').addEventListener('input',function(){minRating=parseFloat(this.value);document.getElementById('lbl-rating').textContent=minRating.toFixed(1);render();});
document.getElementById('cb-instagram').addEventListener('change',function(){onlyInstagram=this.checked;if(this.checked){document.getElementById('cb-social').checked=false;onlySocial=false;}render();});
document.getElementById('cb-social').addEventListener('change',function(){onlySocial=this.checked;if(this.checked){document.getElementById('cb-instagram').checked=false;onlyInstagram=false;}render();});

// ── Export CSV ─────────────────────────────────────────────────────────────
function exportCSV(){
  var NL={verkocht:'Verkocht',interesse:'Follow-up',later:'Later',nee:'Nee',dicht:'Dicht'};
  var rijen=[['Naam','Status','Notitie','Categorie','Adres','Telefoon','Maps URL','Tijd']];
  DATA.forEach(function(p){var vg=voortgang[p.id];if(!vg||!vg.status)return;rijen.push([p.n,NL[vg.status]||vg.status,vg.notitie||'',p.c,p.a,p.p||'',mapsUrl(p),vg.tijd||'']);});
  if(rijen.length<=1){alert('Nog geen bedrijven gemarkeerd.');return;}
  var csv=rijen.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\r\n');
  var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='voortgang_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
document.getElementById('btn-export').addEventListener('click',exportCSV);

// ── Data laden → kaart direct zichtbaar ───────────────────────────────────
fetch('/data.json').then(function(r){return r.json();}).then(function(data){
  DATA=data;
  DATA.forEach(function(p,i){pidToIdx[p.id]=i;});
  document.getElementById('loading').style.display='none';
  document.getElementById('counter').textContent='Markers laden...';

  leafletMarkers=new Array(DATA.length);
  var counts={},i=0,BATCH=400;
  function nextBatch(){
    var end=Math.min(i+BATCH,DATA.length),toAdd=[];
    for(;i<end;i++){
      var p=DATA[i];
      counts[p.c]=(counts[p.c]||0)+1;
      var kl=catKleur(p);
      var m=L.marker([p.lt,p.ln],{icon:maakMarkerIcon(kl,false)});
      (function(pp){m.bindPopup(function(){return popupHtml(pp);},{maxWidth:300,minWidth:240})})(p);
      leafletMarkers[i]=m;
      if(selectedCats.has(p.c)) toAdd.push(m);
    }
    cluster.addLayers(toAdd);
    if(i<DATA.length){
      setTimeout(nextBatch,0);
    }else{
      buildCatList(counts);
      document.getElementById('counter').textContent=DATA.length+' prospects';
      laadVoortgang();
    }
  }
  nextBatch();
}).catch(function(){
  document.getElementById('loading').innerHTML='<div style="text-align:center">Fout bij laden.<br>Herlaad de pagina.</div>';
});

// ── Live locatie ───────────────────────────────────────────────────────────
var locMarker=null;
map.on('locationfound',function(e){
  if(!locMarker){
    locMarker=L.marker(e.latlng,{
      icon:L.divIcon({html:'<div class="loc-dot"></div>',className:'',iconSize:[16,16],iconAnchor:[8,8]}),
      zIndexOffset:1000
    }).addTo(map);
  } else {
    locMarker.setLatLng(e.latlng);
  }
});
map.locate({watch:true,enableHighAccuracy:true});

// ── Voortgang laden nadat markers klaar zijn ───────────────────────────────
function laadVoortgang(){
  fetch('/api/voortgang').then(function(r){return r.json();}).then(function(d){
    voortgang=d;
    DATA.forEach(function(p,idx){
      var vg=voortgang[p.id],st=vg?vg.status:'';
      if(!st) return;
      var kl=STATUS_KLEUR[st];
      leafletMarkers[idx].setIcon(maakMarkerIcon(kl,true));
    });
  }).catch(function(){});
}
</script>
